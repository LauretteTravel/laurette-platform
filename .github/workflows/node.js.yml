name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: اختبارات (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite يحتاج 22.5+، لذلك لا نختبر 18/20
        node: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: إصدار Node
        run: node --version

      - name: فحص الصياغة
        run: node --check server.js

      - name: الاختبارات (53 اختبارًا، بلا اعتماديات خارجية)
        run: npm test
        env:
          NODE_ENV: test

      - name: التحقق من بناء البذرة
        run: node tools/build-seed.mjs

  deploy_render:
    name: Deploy to Render
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::Add the RENDER_DEPLOY_HOOK Actions secret to enable Render auto-deploys."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy requested."
