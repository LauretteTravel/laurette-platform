<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp to CRM Bridge</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
    body { width: 320px; margin: 0; padding: 20px; }
    h1 { font-size: 1.25rem; margin: 0; }
    p { margin: .5rem 0 1rem; }
    fieldset { display: grid; gap: .5rem; margin: 0; padding: 0; border: 0; }
    label { font-weight: 650; }
    input, button { box-sizing: border-box; width: 100%; font: inherit; }
    input { padding: .55rem; margin-bottom: .45rem; border: 1px solid GrayText; border-radius: 6px; }
    button { padding: .65rem; border: 0; border-radius: 6px; color: white; background: #086449; }
    button:disabled { opacity: .65; }
    small { display: block; margin-top: .75rem; }
    #status { min-height: 1.45em; margin-bottom: 0; font-weight: 650; }
  </style>
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>WhatsApp to CRM Bridge</h1>
  <p>Connect your CRM, then click Sync to CRM in an open chat.</p>
  <form id="settings" autocomplete="off">
    <fieldset id="fields" disabled>
      <label for="endpoint">CRM API endpoint</label>
      <input id="endpoint" type="url" required maxlength="2048"
             placeholder="https://your-crm-domain.com/api/save-chat" spellcheck="false">
      <label for="token">Bearer token or API key</label>
      <input id="token" type="password" required maxlength="4096"
             autocomplete="off" spellcheck="false" aria-describedby="credential-note">
      <button type="submit">Save Settings</button>
    </fieldset>
    <small id="credential-note">Chrome Sync can copy this credential to your other signed-in browsers.</small>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</body>
</html>
